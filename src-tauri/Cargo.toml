[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2.7.0"
# ya viene con tauri-plugin-sql: misma version, sin compilar de mas
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tiny_http = "0.12"
# LLM compatible con OpenAI (Ollama / Gemini / Claude) para sugerir tareas de reuniones
ureq = "3.4.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
block2 = "0.6" # bloque de AVCaptureDevice.requestAccess (permiso de Micrófono); ya venía con objc2
# Reuniones: audio del sistema + micrófono (macOS 15+) y whisper.cpp local con Metal
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
