# Instalador de Windows (NSIS, sin firmar; idioma, imágenes y nombre en src-tauri/tauri.windows.conf.json): Actions → windows → el artefacto "Desktop-Pet-windows".
name: windows
on:
  workflow_dispatch:
  push:
    branches: [windows]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Pet-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
