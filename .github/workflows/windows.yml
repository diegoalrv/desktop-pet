# Instalador de Windows (NSIS, sin firmar; idioma, imágenes y nombre en src-tauri/tauri.windows.conf.json).
# Para publicar: subir "version" en src-tauri/tauri.conf.json, commit y `git tag vX.Y.Z && git push --tags`.
# Crea la release v<version> con el .exe y el latest.json que la app consulta al arrancar para auto-actualizarse.
name: windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ggml-avx2 # whisper-rs-sys no se recompila si cambian las GGML_*: cambiar la llave al tocarlas
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          # whisper.cpp con MSVC detecta el CPU del runner (puede salir AVX-512, que se cae en la mayoría de los PCs,
          # o nada, que lo deja decenas de veces más lento). Sin NATIVE compila AVX2+FMA+F16C: cualquier x86 desde 2013.
          GGML_NATIVE: 'OFF'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Candola v__VERSION__
          releaseDraft: false
          args: --bundles nsis
